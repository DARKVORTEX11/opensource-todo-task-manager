{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block page_heading %}
Edit Task
{% endblock %}


{% block content %}

<div class="edit-panel">

    <form
        method="POST"
        action="{{ url_for('edit_task', task_id=task['id']) }}"
    >

        <div class="form-group">

            <label
                class="form-label"
                for="title"
            >
                Task title
            </label>

            <input
                class="input"
                id="title"
                type="text"
                name="title"
                value="{{ task['title'] }}"
                required
            >

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="description"
            >
                Description
            </label>

            <textarea
                class="textarea"
                id="description"
                name="description"
                placeholder="Add some details..."
            >{{ task['description'] }}</textarea>

        </div>


        <div class="form-grid">

            <div class="form-group">

                <label
                    class="form-label"
                    for="priority"
                >
                    Priority
                </label>

                <select
                    class="select"
                    id="priority"
                    name="priority"
                >

                    {% for priority in priorities %}

                    <option
                        value="{{ priority }}"
                        {% if task['priority'] == priority %}
                        selected
                        {% endif %}
                    >
                        {{ priority }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <div class="form-group">

                <label
                    class="form-label"
                    for="status"
                >
                    Status
                </label>

                <select
                    class="select"
                    id="status"
                    name="status"
                >

                    {% for status in statuses %}

                    <option
                        value="{{ status }}"
                        {% if task['status'] == status %}
                        selected
                        {% endif %}
                    >
                        {{ status }}
                    </option>

                    {% endfor %}

                </select>

            </div>

        </div>


        <div class="form-group">

            <label
                class="form-label"
                for="due_date"
            >
                Due date
            </label>

            <input
                class="input"
                id="due_date"
                type="date"
                name="due_date"
                value="{{ task['due_date'] }}"
            >

        </div>


        <div class="form-actions">

            <button
                type="submit"
                class="primary-button"
            >
                Save changes
            </button>

            <a
                href="{{ url_for('index') }}"
                class="secondary-button"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
