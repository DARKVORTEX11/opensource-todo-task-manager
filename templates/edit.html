{% extends "base.html" %}{% block title %}Edit Task{% endblock %}{% block content %}<div class="narrow panel"><p class="eyebrow">TASK DETAILS</p><h1>Edit task</h1><form class="edit-form" method="post"><label>Task title<input name="title" value="{{ task.title }}" required maxlength="200"></label><label>Description<textarea name="description" rows="4">{{ task.description }}</textarea></label><div class="two-col"><label>Priority<select name="priority">{% for p in priorities %}<option {% if task.priority==p %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></label><label>Due date<input type="date" name="due_date" value="{{ task.due_date }}"></label></div><label>Status<select name="status">{% for s in statuses %}<option {% if task.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><div class="form-actions"><a class="button secondary" href="{{ url_for('index') }}">Cancel</a><button class="button">Save changes</button></div></form></div>{% endblock %}
